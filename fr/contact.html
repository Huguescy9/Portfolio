<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <script>document.documentElement.classList.add('js');</script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/commun.css?v=5">
  <link rel="stylesheet" href="../css/page-contact.css?v=5">
</head>
<body>
  <header class="barre">
    <a class="marque" href="index.html">CHANE-YIN Hugues</a>
    <button class="ouvre-menu" id="ouvreMenu" aria-expanded="false" aria-controls="menu">Menu</button>
    <nav class="menu" id="menu" aria-label="Navigation principale">
      <a href="index.html">Accueil</a>
      <a href="projets.html">Projets</a>
      <a href="competences.html">Compétences</a>
      <a href="parcours.html">Parcours</a>
      <a href="contact.html" aria-current="page">Contact</a>
      <a class="lien-cv" href="cv.html">CV</a>
    </nav>
  </header>

  <main>
    <section class="entete"><h1 id="t-page">Contactez-moi</h1></section>

    <section class="contact">
      <div class="infos">
        <h2>Informations de contact</h2>
        <a class="mail" href="mailto:h.chane-yin@rt-iut.re">h.chane-yin@rt-iut.re</a>
        <div class="actions"><button class="geste" id="copier" data-mail="h.chane-yin@rt-iut.re">Copier mon e-mail</button></div>
        <p class="ligne-info"><i class="fas fa-phone" aria-hidden="true"></i>+0692 23 45 67</p>
        <p class="ligne-info"><i class="fas fa-map-marker-alt" aria-hidden="true"></i>La Réunion</p>
        <div class="reseaux">
          <a href="https://www.linkedin.com/in/hugues-chane-yin-75b925341/" target="_blank" rel="noopener" title="LinkedIn" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
          <a href="https://github.com/Huguescy9" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub"><i class="fab fa-github"></i></a>
        </div>
      </div>

      <div class="formulaire">
        <h2>Envoyez-moi un message</h2>
        <form id="contact-form">
          <div class="champ">
            <label for="name">Nom</label>
            <input type="text" id="name" name="name" autocomplete="name" required>
          </div>
          <div class="champ">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
          </div>
          <div class="champ">
            <label for="title">Sujet</label>
            <input type="text" id="title" name="title" required>
          </div>
          <div class="champ">
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
          </div>
          <button type="submit" class="envoyer">Envoyer le message</button>
          <input type="hidden" name="time" id="time">
          <p class="etat" id="etat" role="status" aria-live="polite" data-ok="Message envoyé avec succès !" data-erreur="Une erreur est survenue lors de l'envoi du message."></p>
        </form>
      </div>
    </section>
  </main>

  <div id="pied"></div>

  <div id="feuille" role="dialog" aria-modal="true" aria-labelledby="f-t" data-lenis-prevent>
    <img id="f-i" alt="">
    <div class="cont" id="f-c"></div>
  </div>
  <button id="clore">Fermer</button>
  <div id="toast" role="status"></div>

  <script src="../js/lib/gsap.min.js"></script>
  <script src="../js/lib/ScrollTrigger.min.js"></script>
  <script src="../js/lib/lenis.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="../js/commun.js?v=5"></script>
  <script src="../js/contact.js?v=4"></script>
</body>
</html>
