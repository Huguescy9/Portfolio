<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHANE-YIN Hugues - Contact</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <!-- Modular CSS -->
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/header-footer.css">
  <link rel="stylesheet" href="../css/contact.css">
</head>
<body>
  <div id="header-placeholder"></div>

  <section id="contact">
    <div class="container">
      <h2 class="section-title">Contact Me</h2>
      <div class="contact-wrapper">
        
        <div class="contact-info">
          <h3>Contact Information</h3>
          <p><i class="fas fa-envelope"></i> h.chane-yin@rt-iut.re</p>
          <p><i class="fas fa-phone"></i> +0692 23 45 67</p>
          <p><i class="fas fa-map-marker-alt"></i> Reunion Island</p>
          <div class="social-links">
            <a href="https://www.linkedin.com/in/hugues-chane-yin-75b925341/" target="_blank" title="LinkedIn">
              <i class="fab fa-linkedin"></i>
            </a>
            <a href="https://github.com/Huguescy9" target="_blank" title="GitHub">
              <i class="fab fa-github"></i>
            </a>
          </div>
        </div>

        <div class="contact-form">
          <h3>Send Me a Message</h3>
          <div class="success-message" id="successMessage">
            Message sent successfully!
          </div>

          <form id="contact-form">
            <div class="form-group">
              <label for="name">Name</label>
              <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
              <label for="title">Subject</label>
              <input type="text" id="title" name="title" required>
            </div>
            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" name="message" required></textarea>
            </div>

            <button type="submit">Send Message</button>
            <input type="hidden" name="time" id="time">
          </form>
        </div>

      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="../load-components.js"></script>

  <!-- EmailJS Script -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    (function() {
      emailjs.init("5isJBmAuFL6ZYuSz0");
    })();

    document.getElementById("contact-form").addEventListener("submit", function(e) {
      e.preventDefault();
      document.getElementById("time").value = new Date().toLocaleString();

      const button = this.querySelector("button");
      button.disabled = true;
      button.textContent = "Sending...";

      emailjs.sendForm("service_m2yfsk6", "template_sxbx8dh", this)
        .then(() => {
          alert("✅ Message sent successfully!");
          this.reset();
        })
        .catch((error) => {
          console.error("EmailJS Error:", error);
          alert("❌ An error occurred while sending the message.");
        })
        .finally(() => {
          button.disabled = false;
          button.textContent = "Send Message";
        });
    });
  </script>

</body>
</html>
